name: Validate OrderOfTheLionGM 1.8.0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua 5.1 parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate release metadata and TOC
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          root = Path('.')
          toc = root / 'OrderOfTheLionGM.toc'
          if not toc.is_file():
              raise SystemExit('Missing OrderOfTheLionGM.toc at repository root')

          text = toc.read_text(encoding='utf-8-sig')
          meta = {}
          lua_files = []
          for raw in text.splitlines():
              line = raw.strip()
              if not line:
                  continue
              if line.startswith('##'):
                  m = re.match(r'^##\s*([^:]+):\s*(.*)$', line)
                  if m:
                      meta[m.group(1).strip()] = m.group(2).strip()
              elif not line.startswith('#'):
                  lua_files.append(line.replace('\\', '/'))

          expected = {
              'Interface': '11200',
              'Version': '1.8.0',
              'X-Build': 'final-public-20260808',
          }
          for key, value in expected.items():
              if meta.get(key) != value:
                  raise SystemExit(f'{key}: expected {value!r}, got {meta.get(key)!r}')

          if not lua_files:
              raise SystemExit('TOC contains no Lua files')
          if len(lua_files) != len(set(lua_files)):
              raise SystemExit('TOC contains duplicate Lua paths')

          missing = [p for p in lua_files if not (root / p).is_file()]
          if missing:
              raise SystemExit('Missing TOC files: ' + ', '.join(missing))

          required = ['README.md', 'LICENSE', 'CHANGELOG.md', 'RELEASE_NOTES_1.8.0.md']
          missing_required = [p for p in required if not (root / p).is_file()]
          if missing_required:
              raise SystemExit('Missing release files: ' + ', '.join(missing_required))

          print(f'PASS: {len(lua_files)} unique Lua files; version 1.8.0; Interface 11200')

      - name: Compile every TOC Lua file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            file="${file//\\//}"
            luac5.1 -p "$file"
          done < <(grep -v '^##' OrderOfTheLionGM.toc | sed '/^[[:space:]]*$/d')

      - name: Verify build manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re

          manifest = Path('BUILD_MANIFEST_1.8.0.txt')
          if not manifest.is_file():
              raise SystemExit('Missing BUILD_MANIFEST_1.8.0.txt')

          checked = 0
          for raw in manifest.read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              m = re.match(r'^([0-9a-fA-F]{64})\s+\*?(.+)$', line)
              if not m:
                  continue
              expected, rel = m.group(1).lower(), m.group(2).strip().replace('\\', '/')
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'Manifest file missing: {rel}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'SHA-256 mismatch: {rel}')
              checked += 1

          if checked == 0:
              raise SystemExit('No SHA-256 entries found in manifest')
          print(f'PASS: verified {checked} manifest entries')

      - name: Package structure smoke test
        shell: python
        run: |
          from pathlib import Path
          import zipfile, tempfile, shutil

          root = Path('.')
          skip_roots = {'.git', '.github'}
          skip_names = {'OrderOfTheLionGM-1.8.0-ci-check.zip'}
          out = root / 'OrderOfTheLionGM-1.8.0-ci-check.zip'

          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if rel.parts and rel.parts[0] in skip_roots:
                      continue
                  if p.name in skip_names:
                      continue
                  z.write(p, Path('OrderOfTheLionGM') / rel)

          with zipfile.ZipFile(out) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = z.namelist()
              required = 'OrderOfTheLionGM/OrderOfTheLionGM.toc'
              if required not in names:
                  raise SystemExit(f'Missing {required} in packaged ZIP')
              if any(n.startswith('OrderOfTheLionGM/OrderOfTheLionGM/') for n in names):
                  raise SystemExit('Double-nested addon folder detected')

          print('PASS: release ZIP structure is valid')
